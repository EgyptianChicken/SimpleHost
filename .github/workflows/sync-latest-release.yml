name: Sync latest release manifest

on:
  release:
    types: [published, released]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build verified release manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRows = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json |
            Where-Object { -not $_.draft -and -not $_.prerelease } |
            Sort-Object { [datetime]$_.published_at } -Descending |
            Select-Object -First 50)
          if ($releaseRows.Count -eq 0) { throw 'No stable releases were found.' }

          $manifestRows = [System.Collections.Generic.List[object]]::new()
          foreach ($release in $releaseRows) {
            $installer = @($release.assets | Where-Object {
              $_.name -match '^SimpleHost-Setup(?:-\d+\.\d+\.\d+(?:\.\d+)?)?\.exe$' -and $_.size -gt 0
            } | Sort-Object { $_.name.Length } -Descending | Select-Object -First 1)
            if ($installer.Count -eq 0) { continue }
            $installer = $installer[0]
            $checksumAsset = $release.assets | Where-Object { $_.name -eq "$($installer.name).sha256" } | Select-Object -First 1
            if (-not $checksumAsset) { continue }

            $checksumResponse = Invoke-WebRequest -Uri $checksumAsset.browser_download_url
            $checksumText = if ($checksumResponse.Content -is [byte[]]) {
              [Text.Encoding]::UTF8.GetString($checksumResponse.Content)
            } else {
              [string]$checksumResponse.Content
            }
            $checksumText = $checksumText.Trim()
            $escapedName = [regex]::Escape($installer.name)
            $checksumMatch = [regex]::Match($checksumText, "(?m)^([a-fA-F0-9]{64})\s+\*?$escapedName\s*$")
            if (-not $checksumMatch.Success) { continue }

            $manifestRows.Add([pscustomobject][ordered]@{
              id = [long]$release.id
              version = [string]$release.tag_name
              title = if ($release.name) { [string]$release.name } else { [string]$release.tag_name }
              notes = [string]$release.body
              publishedAt = [string]$release.published_at
              size = [long]$installer.size
              filename = [string]$installer.name
              url = [string]$installer.browser_download_url
              sourceUrl = [string]$release.html_url
              sha256 = $checksumMatch.Groups[1].Value.ToLowerInvariant()
              windows = $null
            })
          }
          if ($manifestRows.Count -eq 0 -or $manifestRows[0].id -ne $releaseRows[0].id) {
            throw 'The newest stable release is missing a valid installer or checksum.'
          }
          [ordered]@{ releases = @($manifestRows) } | ConvertTo-Json -Depth 5 |
            Set-Content -NoNewline -Encoding utf8 simplehost-latest.json

      - name: Publish manifest update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simplehost-latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update latest release manifest"
          git push
