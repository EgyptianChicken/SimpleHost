name: Sync latest release manifest

on:
  release:
    types: [published, released]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build verified release manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) { throw 'The latest release is not stable.' }

          $installers = @($release.assets | Where-Object {
            $_.name -match '^SimpleHost-Setup(?:-\d+\.\d+\.\d+(?:\.\d+)?)?\.exe$' -and $_.size -gt 0
          })
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer, found $($installers.Count)." }
          $installer = $installers[0]
          $checksumAsset = $release.assets | Where-Object { $_.name -eq "$($installer.name).sha256" } | Select-Object -First 1
          if (-not $checksumAsset) { throw 'The matching SHA-256 asset is missing.' }

          $checksumText = (Invoke-WebRequest -Uri $checksumAsset.browser_download_url).Content.Trim()
          $escapedName = [regex]::Escape($installer.name)
          $checksumMatch = [regex]::Match($checksumText, "(?m)^([a-fA-F0-9]{64})\s+\*?$escapedName\s*$")
          if (-not $checksumMatch.Success) { throw 'The SHA-256 file does not match the installer.' }

          $manifest = [ordered]@{
            id = [long]$release.id
            version = [string]$release.tag_name
            title = if ($release.name) { [string]$release.name } else { [string]$release.tag_name }
            notes = [string]$release.body
            publishedAt = [string]$release.published_at
            size = [long]$installer.size
            filename = [string]$installer.name
            url = [string]$installer.browser_download_url
            sourceUrl = [string]$release.html_url
            sha256 = $checksumMatch.Groups[1].Value.ToLowerInvariant()
            windows = $null
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -NoNewline -Encoding utf8 simplehost-latest.json

      - name: Publish manifest update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simplehost-latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update latest release manifest"
          git push
